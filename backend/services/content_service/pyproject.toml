[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yifabao-content-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "yifabao-agent-core==0.1.0",
  "fastapi>=0.115,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "python-multipart>=0.0.20,<1",
  "pillow>=10,<13",
  "imageio-ffmpeg>=0.6,<1",
  "httpx>=0.27,<1",
  "requests>=2.32,<3",
  "tos>=2.9,<3",
  "python-docx>=1.1,<2",
  "pypdf>=5,<7",
  "reportlab==4.4.9",
  "uiautomator2==3.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
content_service = ["chat_fonts/NotoSansSC-Regular.ttf", "chat_fonts/OFL.txt"]
