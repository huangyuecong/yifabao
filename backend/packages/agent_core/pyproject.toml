[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yifabao-agent-core"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "platform-auth==0.1.0",
  "pydantic>=2.10,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

