services:
  content-service:
    build:
      context: .
      dockerfile: services/content_service/Dockerfile
    ports:
      - "8002:8002"
    environment:
      CONTENT_DATA_DIR: /data
      CONTENT_DATABASE_URL: ${CONTENT_DATABASE_URL:-sqlite:////data/content.db}
      CONTENT_CORS_ORIGINS: ${CONTENT_CORS_ORIGINS:-http://127.0.0.1:8200,http://localhost:8200,http://127.0.0.1:5173,http://localhost:5173}
      CONTENT_ARK_API_KEY: ${CONTENT_ARK_API_KEY:-}
      CONTENT_ARK_API_KEY_FILE: ${CONTENT_ARK_API_KEY_FILE:-}
      CONTENT_LLM_PROVIDER: ${CONTENT_LLM_PROVIDER:-}
      CONTENT_LLM_PROVIDER_ID: ${CONTENT_LLM_PROVIDER_ID:-}
      CONTENT_LLM_BASE_URL: ${CONTENT_LLM_BASE_URL:-}
      CONTENT_LLM_API_KEY: ${CONTENT_LLM_API_KEY:-}
      CONTENT_LLM_API_KEY_FILE: ${CONTENT_LLM_API_KEY_FILE:-}
      CONTENT_LLM_MODEL: ${CONTENT_LLM_MODEL:-}
      CONTENT_LLM_TIMEOUT_SECONDS: ${CONTENT_LLM_TIMEOUT_SECONDS:-120}
      CONTENT_LLM_MAX_OUTPUT_TOKENS: ${CONTENT_LLM_MAX_OUTPUT_TOKENS:-4000}
      CONTENT_LLM_TEMPERATURE: ${CONTENT_LLM_TEMPERATURE:-0.2}
      CONTENT_LLM_MAX_ATTEMPTS: ${CONTENT_LLM_MAX_ATTEMPTS:-2}
      CONTENT_IMAGE_PROVIDER: ${CONTENT_IMAGE_PROVIDER:-}
      CONTENT_IMAGE_PROVIDER_ID: ${CONTENT_IMAGE_PROVIDER_ID:-}
      CONTENT_IMAGE_BASE_URL: ${CONTENT_IMAGE_BASE_URL:-}
      CONTENT_IMAGE_API_KEY: ${CONTENT_IMAGE_API_KEY:-}
      CONTENT_IMAGE_API_KEY_FILE: ${CONTENT_IMAGE_API_KEY_FILE:-}
      CONTENT_IMAGE_MODEL: ${CONTENT_IMAGE_MODEL:-}
      CONTENT_IMAGE_TIMEOUT_SECONDS: ${CONTENT_IMAGE_TIMEOUT_SECONDS:-180}
      CONTENT_IMAGE_MAX_CANDIDATES: ${CONTENT_IMAGE_MAX_CANDIDATES:-4}
      CONTENT_IMAGE_SUPPORTED_SIZES: ${CONTENT_IMAGE_SUPPORTED_SIZES:-}
      CONTENT_IMAGE_SUPPORTED_RATIOS: ${CONTENT_IMAGE_SUPPORTED_RATIOS:-}
      CONTENT_SPEECH_PROVIDER: ${CONTENT_SPEECH_PROVIDER:-}
      CONTENT_SPEECH_PROVIDER_ID: ${CONTENT_SPEECH_PROVIDER_ID:-}
      CONTENT_SPEECH_BASE_URL: ${CONTENT_SPEECH_BASE_URL:-}
      CONTENT_SPEECH_API_KEY: ${CONTENT_SPEECH_API_KEY:-}
      CONTENT_SPEECH_API_KEY_FILE: ${CONTENT_SPEECH_API_KEY_FILE:-}
      CONTENT_SPEECH_APP_ID: ${CONTENT_SPEECH_APP_ID:-}
      CONTENT_SPEECH_ACCESS_TOKEN: ${CONTENT_SPEECH_ACCESS_TOKEN:-}
      CONTENT_SPEECH_ACCESS_TOKEN_FILE: ${CONTENT_SPEECH_ACCESS_TOKEN_FILE:-}
      CONTENT_SPEECH_RESOURCE_ID: ${CONTENT_SPEECH_RESOURCE_ID:-}
      CONTENT_SPEECH_CLUSTER: ${CONTENT_SPEECH_CLUSTER:-volcano_tts}
      CONTENT_SPEECH_VOICE_TYPE: ${CONTENT_SPEECH_VOICE_TYPE:-}
      CONTENT_SPEECH_SUPPORTED_VOICES: ${CONTENT_SPEECH_SUPPORTED_VOICES:-}
      CONTENT_SPEECH_TIMEOUT_SECONDS: ${CONTENT_SPEECH_TIMEOUT_SECONDS:-180}
      CONTENT_SUBTITLE_MAX_CHARS_PER_LINE: ${CONTENT_SUBTITLE_MAX_CHARS_PER_LINE:-24}
      CONTENT_SUBTITLE_MAX_LINES: ${CONTENT_SUBTITLE_MAX_LINES:-2}
      CONTENT_AI_VIDEO_PROVIDER: ${CONTENT_AI_VIDEO_PROVIDER:-}
      CONTENT_AI_VIDEO_PROVIDER_ID: ${CONTENT_AI_VIDEO_PROVIDER_ID:-}
      CONTENT_AI_VIDEO_BASE_URL: ${CONTENT_AI_VIDEO_BASE_URL:-}
      CONTENT_AI_VIDEO_API_KEY: ${CONTENT_AI_VIDEO_API_KEY:-}
      CONTENT_AI_VIDEO_API_KEY_FILE: ${CONTENT_AI_VIDEO_API_KEY_FILE:-}
      CONTENT_AI_VIDEO_MODEL: ${CONTENT_AI_VIDEO_MODEL:-}
      CONTENT_AI_VIDEO_TIMEOUT_SECONDS: ${CONTENT_AI_VIDEO_TIMEOUT_SECONDS:-60}
      CONTENT_AI_VIDEO_POLL_INTERVAL_SECONDS: ${CONTENT_AI_VIDEO_POLL_INTERVAL_SECONDS:-3}
      CONTENT_AI_VIDEO_MAX_WAIT_SECONDS: ${CONTENT_AI_VIDEO_MAX_WAIT_SECONDS:-900}
      CONTENT_AI_VIDEO_SUPPORTED_DURATIONS: ${CONTENT_AI_VIDEO_SUPPORTED_DURATIONS:-}
      CONTENT_AI_VIDEO_SUPPORTED_RATIOS: ${CONTENT_AI_VIDEO_SUPPORTED_RATIOS:-}
      CONTENT_AI_VIDEO_SUPPORTED_RESOLUTIONS: ${CONTENT_AI_VIDEO_SUPPORTED_RESOLUTIONS:-}
      CONTENT_PROVIDER_MEDIA_BASE_URL: ${CONTENT_PROVIDER_MEDIA_BASE_URL:-}
      CONTENT_PROVIDER_MEDIA_SIGNING_SECRET: ${CONTENT_PROVIDER_MEDIA_SIGNING_SECRET:-}
      CONTENT_PROVIDER_MEDIA_SIGNING_SECRET_FILE: ${CONTENT_PROVIDER_MEDIA_SIGNING_SECRET_FILE:-}
      CONTENT_PROVIDER_MEDIA_URL_TTL_SECONDS: ${CONTENT_PROVIDER_MEDIA_URL_TTL_SECONDS:-900}
      CONTENT_PROVIDER_MEDIA_TOS_ENDPOINT: ${CONTENT_PROVIDER_MEDIA_TOS_ENDPOINT:-}
      CONTENT_PROVIDER_MEDIA_TOS_REGION: ${CONTENT_PROVIDER_MEDIA_TOS_REGION:-}
      CONTENT_PROVIDER_MEDIA_TOS_BUCKET: ${CONTENT_PROVIDER_MEDIA_TOS_BUCKET:-}
      CONTENT_PROVIDER_MEDIA_TOS_ACCESS_KEY: ${CONTENT_PROVIDER_MEDIA_TOS_ACCESS_KEY:-}
      CONTENT_PROVIDER_MEDIA_TOS_ACCESS_KEY_FILE: ${CONTENT_PROVIDER_MEDIA_TOS_ACCESS_KEY_FILE:-}
      CONTENT_PROVIDER_MEDIA_TOS_SECRET_KEY: ${CONTENT_PROVIDER_MEDIA_TOS_SECRET_KEY:-}
      CONTENT_PROVIDER_MEDIA_TOS_SECRET_KEY_FILE: ${CONTENT_PROVIDER_MEDIA_TOS_SECRET_KEY_FILE:-}
      CONTENT_PROVIDER_MEDIA_TOS_SECURITY_TOKEN: ${CONTENT_PROVIDER_MEDIA_TOS_SECURITY_TOKEN:-}
      CONTENT_PROVIDER_MEDIA_TOS_SECURITY_TOKEN_FILE: ${CONTENT_PROVIDER_MEDIA_TOS_SECURITY_TOKEN_FILE:-}
      CONTENT_PROVIDER_MEDIA_TOS_KEY_PREFIX: ${CONTENT_PROVIDER_MEDIA_TOS_KEY_PREFIX:-provider-media/reference-videos}
      CONTENT_PROVIDER_MEDIA_TOS_URL_TTL_SECONDS: ${CONTENT_PROVIDER_MEDIA_TOS_URL_TTL_SECONDS:-900}
      CONTENT_PROVIDER_MEDIA_TOS_OBJECT_TTL_DAYS: ${CONTENT_PROVIDER_MEDIA_TOS_OBJECT_TTL_DAYS:-1}
      CONTENT_PROVIDER_MEDIA_TOS_CONNECT_TIMEOUT_SECONDS: ${CONTENT_PROVIDER_MEDIA_TOS_CONNECT_TIMEOUT_SECONDS:-10}
      CONTENT_PROVIDER_MEDIA_TOS_SOCKET_TIMEOUT_SECONDS: ${CONTENT_PROVIDER_MEDIA_TOS_SOCKET_TIMEOUT_SECONDS:-60}
      CONTENT_FFMPEG_PATH: ${CONTENT_FFMPEG_PATH:-}
      CONTENT_FFMPEG_TIMEOUT_SECONDS: ${CONTENT_FFMPEG_TIMEOUT_SECONDS:-600}
      CONTENT_KNOWLEDGE_PROVIDER: ${CONTENT_KNOWLEDGE_PROVIDER:-library_db}
      CONTENT_KNOWLEDGE_TOP_K: ${CONTENT_KNOWLEDGE_TOP_K:-4}
      CONTENT_KNOWLEDGE_NAMESPACE: ${CONTENT_KNOWLEDGE_NAMESPACE:-content-service}
      CONTENT_KNOWLEDGE_DIR: ${CONTENT_KNOWLEDGE_DIR:-}
    volumes:
      - content-data:/data

volumes:
  content-data:
